name: deploy

on:
  workflow_run:
    workflows: [tests]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deploy even if tests failed'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # workflow_run's `branches` filter matches fork PR branches named "main" too:
    # only deploy after a successful push to this repository's main branch.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    timeout-minutes: 15

    steps:
      # Secrets upserted into the VPS .env as <KEY>='<value>'. Only the secrets listed
      # under `env` are exposed to this job; each must be named ENV_<KEY>, e.g.:
      #   env:
      #     ENV_SOME_API_KEY: ${{ secrets.ENV_SOME_API_KEY }}
      # Values must not contain a single quote or a newline.
      - name: Collect .env secrets
        env:
          ENV_DB_PASSWORD: ${{ secrets.ENV_DB_PASSWORD }}
          ENV_IGDB_TWITCH_CLIENT_ID: ${{ secrets.ENV_IGDB_TWITCH_CLIENT_ID }}
          ENV_IGDB_TWITCH_CLIENT_SECRET: ${{ secrets.ENV_IGDB_TWITCH_CLIENT_SECRET }}
          ENV_RAWG_API_KEY: ${{ secrets.ENV_RAWG_API_KEY }}
        run: |
          overrides=""
          for name in ${!ENV_@}; do
            value=${!name}
            # Skip keys listed above but not defined as secrets
            [ -z "$value" ] && continue
            case "$value" in
              *"'"* | *$'\n'*) echo "::error::$name contains a single quote or a newline"; exit 1 ;;
            esac
            overrides+="${name#ENV_}='${value}'"$'\n'
          done
          overrides=$(printf '%s' "$overrides" | base64 -w0)
          echo "::add-mask::$overrides"
          echo "DOTENV_OVERRIDES=$overrides" >> "$GITHUB_ENV"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOTENV_OVERRIDES
          script: |
            set -e
            cd /opt/apps/game-discovery
            git pull
            # Keep the previous .env to roll back a wrong secret value
            cp .env .env.previous
            printf '%s' "${DOTENV_OVERRIDES:-}" | base64 -d | while IFS= read -r line; do
              key=${line%%=*}
              sed -i "/^${key}=/d" .env
              printf '%s\n' "$line" >> .env
            done
            COMMIT=$(git rev-parse --short HEAD)
            docker compose build --no-cache --build-arg CACHEBUST=$COMMIT
            docker compose up -d --force-recreate
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            docker compose exec -T app php artisan event:cache
            docker image prune -f
